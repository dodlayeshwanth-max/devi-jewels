<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | devi Jewels</title><link rel="stylesheet" href="style.css"></head><body>
<header class="navbar"><div class="logo">devi<span>JEWELS</span></div><nav><a href="index.html">Home</a><a href="collections.html">Collections</a><a class="active" href="account.html">My Account</a></nav></header>
<main class="account-page"><section class="collection-hero"><p>YOUR devi PROFILE</p><h1>My Account</h1><span></span></section>
<section id="authArea" class="account-grid"><form id="loginForm" class="account-card"><h2>Welcome back</h2><input name="email" type="email" placeholder="Email address" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><form id="registerForm" class="account-card"><h2>Create an account</h2><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email address" required><input name="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><button>Create account</button></form></section>
<section id="profileArea" hidden class="account-grid"><div class="account-card"><h2 id="welcome"></h2><p>Save delivery addresses and use them when checking out.</p><button id="logout">Sign out</button></div><form id="addressForm" class="account-card"><h2>Add delivery address</h2><input name="full_name" placeholder="Full name" required><input name="phone" placeholder="Phone number" required><input name="line1" placeholder="Address line 1" required><input name="line2" placeholder="Address line 2 (optional)"><input name="city" placeholder="City" required><input name="state" placeholder="State" required><input name="postal_code" placeholder="PIN / postal code" required><label><input name="is_default" type="checkbox"> Use as my default address</label><button>Save address</button></form><div class="account-card"><h2>Saved addresses</h2><div id="addresses"></div></div><form id="reviewForm" class="account-card"><h2>Write a review</h2><select id="reviewProduct" required></select><select id="rating" required><option value="5">★★★★★ — 5</option><option value="4">★★★★ — 4</option><option value="3">★★★ — 3</option><option value="2">★★ — 2</option><option value="1">★ — 1</option></select><textarea id="comment" placeholder="Tell us about the piece" required></textarea><button>Publish review</button></form></section></main>
<script>
const token=()=>localStorage.getItem('deviAuth');const request=(url,options={})=>fetch(url,{...options,headers:{'Content-Type':'application/json',...(token()?{Authorization:'Bearer '+token()}:{}),...(options.headers||{})}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d});
async function addresses(){const list=await request('/api/addresses');document.querySelector('#addresses').innerHTML=list.length?list.map(a=>`<article class="saved-address"><strong>${a.full_name}${a.is_default?' · Default':''}</strong><p>${a.line1}${a.line2?', '+a.line2:''}<br>${a.city}, ${a.state} ${a.postal_code}<br>${a.phone}</p></article>`).join(''):'<p>No address saved yet.</p>'}
async function profile(){if(!token())return;try{const me=await request('/api/me');authArea.hidden=true;profileArea.hidden=false;welcome.textContent='Hello, '+me.name;const products=await request('/api/products');reviewProduct.innerHTML=products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');await addresses();}catch{localStorage.removeItem('deviAuth')}}
for(const [form,url] of [[loginForm,'/api/auth/login'],[registerForm,'/api/auth/register']])form.onsubmit=async e=>{e.preventDefault();try{const d=await request(url,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});localStorage.setItem('deviAuth',d.token);location.assign(d.user.role==='admin'?'admin.html':'account.html')}catch(e){alert(e.message)}};
addressForm.onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(addressForm));data.is_default=addressForm.is_default.checked;await request('/api/addresses',{method:'POST',body:JSON.stringify(data)});addressForm.reset();addresses()}catch(e){alert(e.message)}};
reviewForm.onsubmit=async e=>{e.preventDefault();try{await request('/api/products/'+reviewProduct.value+'/reviews',{method:'POST',body:JSON.stringify({rating:+rating.value,comment:comment.value})});comment.value='';alert('Thank you — your review is live.')}catch(e){alert(e.message)}};
logout.onclick=async()=>{await request('/api/auth/logout',{method:'POST'});localStorage.removeItem('deviAuth');location.reload()};profile();
</script><script>
if (location.protocol === 'file:') location.replace('http://localhost:3000/account.html');
</script></body></html>
