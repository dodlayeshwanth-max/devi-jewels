<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | devi</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><div class="logo">devi<span>JEWELS</span></div><nav><a href="index.html">Store</a><a href="account.html">My Account</a><a class="active" href="admin.html">Admin</a></nav></header><main class="admin-page"><section class="collection-hero"><p>STORE MANAGEMENT</p><h1>Admin Studio</h1><span></span></section><section id="gate" class="account-card"><h2>Secure administrator access</h2><p id="gateText">Sign in to your administrator account first.</p><a class="admin-signin" href="account.html">Admin sign in</a><button id="otpRequest" hidden>Send OTP</button><div id="otpEntry" hidden><input id="otp" inputmode="numeric" maxlength="6" placeholder="Six-digit OTP"><button id="otpVerify">Unlock admin studio</button></div></section><section id="studio" hidden class="admin-grid"><form id="productForm" class="account-card"><h2 id="formTitle">Add product</h2><input id="id" type="hidden"><input id="name" placeholder="Product name" required><select id="category"><option>rings</option><option>necklaces</option><option>earrings</option><option>bracelets</option></select><input id="price" type="number" min="0" placeholder="Price" required><input id="stock" type="number" min="0" placeholder="Stock" required><input id="label" placeholder="Label e.g. NEW"><textarea id="description" placeholder="Description"></textarea><input id="imageUrl" placeholder="Image URL"><label>Upload image<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label><input id="featured" type="checkbox"> Feature on homepage</label><button>Save product</button><button type="button" id="clear">Cancel edit</button></form><div class="account-card"><h2>Products</h2><div id="products"></div></div><form id="couponForm" class="account-card"><h2>Coupon codes</h2><input id="code" placeholder="CODE" required><select id="type"><option value="percent">Percentage off</option><option value="fixed">Rupees off</option></select><input id="amount" type="number" min="1" placeholder="Amount" required><input id="minOrder" type="number" min="0" value="0" placeholder="Minimum order"><label><input id="active" type="checkbox" checked> Active</label><button>Save coupon</button><div id="coupons"></div></form></section></main><script>
const userToken=()=>localStorage.getItem('deviAuth'),adminToken=()=>localStorage.getItem('deviAdminUnlock')||userToken();const api=(url,opt={},admin=false)=>fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(admin?adminToken():userToken()),...(opt.headers||{})}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d});let list=[];
async function load(){try{const me=await api('/api/me');if(me.role!=='admin')throw Error();if(!localStorage.getItem('deviAdminUnlock')){gateText.textContent='Request a one-time password to unlock your store controls.';otpRequest.hidden=false;return;}gate.hidden=true;studio.hidden=false;list=await api('/api/admin/products',{},true);products.innerHTML=list.map(p=>`<article class="admin-product"><img src="${p.imageUrl}" alt=""><div><strong>${p.name}</strong><p>₹${p.price} · ${p.stock} in stock</p><button onclick="editProduct(${p.id})">Edit</button><button onclick="deleteProduct(${p.id})">Delete</button></div></article>`).join('');const cs=await api('/api/admin/coupons',{},true);coupons.innerHTML='<h3>Active codes</h3>'+cs.map(c=>`<p><strong>${c.code}</strong> — ${c.type==='percent'?c.amount+'%':'₹'+c.amount} off</p>`).join('');}catch{gateText.textContent='Sign in through My Account using the administrator account.'}}
otpRequest.onclick=async()=>{try{const d=await api('/api/auth/admin-otp/request',{method:'POST'});otpEntry.hidden=false;otpRequest.hidden=true;alert('Your local development OTP is: '+d.developmentCode+'\nIt expires in 5 minutes.')}catch(e){alert(e.message)}};otpVerify.onclick=async()=>{try{const d=await api('/api/auth/admin-otp/verify',{method:'POST',body:JSON.stringify({code:otp.value})});localStorage.setItem('deviAdminUnlock',d.adminToken);load()}catch(e){alert(e.message)}};
async function image(){if(!file.files[0])return imageUrl.value;const data=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(file.files[0])});return (await api('/api/admin/upload',{method:'POST',body:JSON.stringify({image:data})},true)).imageUrl}productForm.onsubmit=async e=>{e.preventDefault();try{const p={name:name.value,category:category.value,price:+price.value,stock:+stock.value,label:label.value,description:description.value,imageUrl:await image(),featured:featured.checked};await api(id.value?'/api/admin/products/'+id.value:'/api/admin/products',{method:id.value?'PUT':'POST',body:JSON.stringify(p)},true);clear.click();load()}catch(e){alert(e.message)}};function editProduct(pid){const p=list.find(x=>x.id===pid);id.value=p.id;name.value=p.name;category.value=p.category;price.value=p.price;stock.value=p.stock;label.value=p.label||'';description.value=p.description||'';imageUrl.value=p.imageUrl;featured.checked=!!p.featured;formTitle.textContent='Edit product'}async function deleteProduct(pid){if(confirm('Delete this product?')){await api('/api/admin/products/'+pid,{method:'DELETE'},true);load()}}clear.onclick=()=>{productForm.reset();id.value='';formTitle.textContent='Add product'};couponForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/coupons',{method:'POST',body:JSON.stringify({code:code.value,type:type.value,amount:+amount.value,minOrder:+minOrder.value,active:active.checked})},true);couponForm.reset();active.checked=true;load()}catch(e){alert(e.message)}};load();
</script></body></html>
